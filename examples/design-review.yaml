schemaVersion: 1
name: design-review
instructions: |
  Review the included material before starting tasks.
  Record concrete evidence in task notes.

tasks:
  - id: inspect
    title: Inspect the project docs
    category: review
    body: Read the README and usage reference, then identify gaps, contradictions, or missing decisions.
    doneWhen:
      - Notes list the sections reviewed.
      - Any findings include file paths or command output.

references:
  - name: readme
    description: Product README.
    ref: ./README.md
  - name: usage
    description: Installed usage reference.
    ref: ./docs/usage.md
